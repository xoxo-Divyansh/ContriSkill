version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: tooling/docker/api.Dockerfile
    env_file:
      - .env
    ports:
      - "4000:4000"
    command: npm run dev --workspace @contriskill/api

  web:
    build:
      context: .
      dockerfile: tooling/docker/web.Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: npm run dev --workspace @contriskill/web
